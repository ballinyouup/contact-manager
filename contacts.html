<html>
<head>
	<title>Personal Contact Manager</title>
	<script type="text/javascript" src="js/code.js"></script>
    <link href="css/styles.css" rel="stylesheet">	
    <link href="https://fonts.googleapis.com/css?family=Ubuntu" rel="stylesheet">
	
	<script type="text/javascript">
	document.addEventListener('DOMContentLoaded', function() 
	{
		readCookie();
	}, false);
	</script>
	
</head>
<body>

<h1 id="title">Personal Contact Manager</h1>

<div id="loggedInDiv">
	<span id="userName"></span><br />
	<button type="button" id="logoutButton" class="buttons" onclick="doLogout();">Log Out</button>
</div>

<div id="accessUIDiv">
	<br />

	<input type="text" id="searchText" placeholder="Search contacts"/>
	<button type="button" id="searchContactButton" class="buttons" onclick="searchContacts();">Search Contacts</button><br />
	<span id="contactSearchResult"></span>
	<table id="contactTable">
		<thead>
			<tr>
				<th>First Name</th>
				<th>Last Name</th>
				<th>Phone</th>
				<th>Email</th>
				<th>Actions</th>
			</tr>
		</thead>
		<tbody id="contactTableBody"></tbody>
	</table><br />

	<input type="text" id="contactFirstName" placeholder="First Name">
	<input type="text" id="contactLastName" placeholder="Last Name">
	<input type="text" id="contactPhone" placeholder="Phone">
	<input type="text" id="contactEmail" placeholder="Email">
	<button type="button" id="addContactButton" class="buttons" onclick="addContact();">Add Contact</button>
	<button type="button" id="updateContactButton" class="buttons" onclick="updateContact();">Update Contact</button>
	<button type="button" id="cancelEditButton" class="buttons secondaryButton" onclick="clearContactForm();">Cancel</button><br />
	<span id="contactSaveResult"></span>
</div>

</body>
</html>
